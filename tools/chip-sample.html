<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0;background:transparent}
  .wrap{width:280px;height:64px;display:flex;flex-direction:column;justify-content:center;gap:10px;
        padding:0 12px;font:11px/1 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .row{display:flex;align-items:center;gap:10px}
  .chip{display:inline-flex;align-items:center;gap:4px;padding:0 6px;line-height:18px}
  .chip svg{width:12px;height:12px;fill:currentColor;flex:none}
  .chip b{font-weight:500;font-variant-numeric:tabular-nums}
  .on{color:#4d9fff}
  .off{color:#8b8b93}
  .cap{color:#8b8b93;font-size:10px}
</style></head><body>
<div class="wrap">
  <div class="row">
    <span class="chip on"><svg viewBox="0 0 24 24"><path d="M2.5 13.6C2.5 9.4 5.6 6.4 9.6 6.4c4.2 0 7.4 3.1 7.4 7.2 0 4.1-3.2 7.2-7.4 7.2-4 0-7.1-3-7.1-7.2Z"/><path d="M16.6 13.6c1.3-.5 2.4-1.5 3.1-2.8.3-.5 1-.5 1.2.1.5 1.1.8 2.3.8 3.5s-.3 2.4-.8 3.5c-.2.6-.9.6-1.2.1-.7-1.3-1.8-2.3-3.1-2.8Z"/><path d="M7.2 5.4c-.5-1.6.3-3.3 2-4-.4 1.3-.1 2.2.5 2.9.5.6.3 1.5-.5 1.9-.9.4-1.8 0-2-.8Z"/></svg><b>28m</b></span>
    <span class="cap">off-peak — half price ends in 28 min</span>
  </div>
  <div class="row">
    <span class="chip off"><svg viewBox="0 0 24 24"><path d="M2.5 13.6C2.5 9.4 5.6 6.4 9.6 6.4c4.2 0 7.4 3.1 7.4 7.2 0 4.1-3.2 7.2-7.4 7.2-4 0-7.1-3-7.1-7.2Z"/><path d="M16.6 13.6c1.3-.5 2.4-1.5 3.1-2.8.3-.5 1-.5 1.2.1.5 1.1.8 2.3.8 3.5s-.3 2.4-.8 3.5c-.2.6-.9.6-1.2.1-.7-1.3-1.8-2.3-3.1-2.8Z"/><path d="M7.2 5.4c-.5-1.6.3-3.3 2-4-.4 1.3-.1 2.2.5 2.9.5.6.3 1.5-.5 1.9-.9.4-1.8 0-2-.8Z"/></svg><b>1h40m</b></span>
    <span class="cap">peak — full price ends in 1 h 40 min</span>
  </div>
</div>
</body></html>
